name: build-cuda

on:
  push:
    tags:
      - 'cuda-v*'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # The vLLM CUDA base image (~10 GB extracted) plus flashinfer-jit-cache
      # and eval deps exceed the ~14 GB free on a default ubuntu-latest runner.
      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune --all --force
          df -h

      # Tag scheme: cuda-vX.Y.Z-N. The vLLM upstream version is embedded in the
      # git tag and used to derive the BASE_IMAGE so the two can't drift.
      - name: Derive vLLM base image from tag
        id: base
        run: |
          tag="${GITHUB_REF_NAME}"
          if [[ ! "$tag" =~ ^cuda-(v[0-9]+\.[0-9]+\.[0-9]+)-[0-9]+$ ]]; then
            echo "::error::tag '$tag' must look like cuda-vX.Y.Z-N (e.g. cuda-v0.22.0-1)"
            exit 1
          fi
          vllm_version="${BASH_REMATCH[1]}"
          base_image="vllm/vllm-openai:${vllm_version}"
          echo "base_image=${base_image}" >>"$GITHUB_OUTPUT"
          echo "Resolved base image: ${base_image}"
          echo "vllm_version=${vllm_version}" >>"$GITHUB_OUTPUT"

      # Each vendored vLLM patch names its upstream PR and issue in its header
      # (Upstream-PR / Upstream-Issue). Annotate the run when the base release
      # already contains the merged PR (drop the patch) or upstream moved on
      # without it (re-check the backport). Warn-only: a GitHub API hiccup
      # must not block a release, and the Dockerfile's apply step is the hard
      # gate either way.
      - name: Check vendored vLLM patches against upstream
        env:
          GH_TOKEN: ${{ github.token }}
          VLLM_VERSION: ${{ steps.base.outputs.vllm_version }}
        run: |
          shopt -s nullglob
          for p in patches/*.patch; do
            pr="$(sed -n 's/^Upstream-PR: vllm-project\/vllm#\([0-9]*\)$/\1/p' "$p")"
            issue="$(sed -n 's/^Upstream-Issue: vllm-project\/vllm#\([0-9]*\)$/\1/p' "$p")"
            if [ -n "$pr" ]; then
              read -r state merge_sha < <(gh api "repos/vllm-project/vllm/pulls/$pr" \
                --jq '[(if .merged then "merged" else .state end), (.merge_commit_sha // "-")] | @tsv') \
                || { echo "::warning file=$p::could not query vLLM PR #$pr"; continue; }
              if [ "$state" = "merged" ]; then
                status="$(gh api "repos/vllm-project/vllm/compare/${VLLM_VERSION}...${merge_sha}" --jq .status || echo unknown)"
                if [ "$status" = "behind" ] || [ "$status" = "identical" ]; then
                  echo "::warning file=$p::vLLM PR #$pr is in ${VLLM_VERSION}; delete this patch and its Dockerfile step"
                else
                  echo "::notice file=$p::vLLM PR #$pr is merged but not in ${VLLM_VERSION}; keep the patch until a release contains it"
                fi
              elif [ "$state" = "closed" ]; then
                echo "::warning file=$p::vLLM PR #$pr was closed without merging; check issue #${issue:-?} for the fix that replaced it"
              fi
            fi
            if [ -n "$issue" ] && [ "$(gh api "repos/vllm-project/vllm/issues/$issue" --jq .state || true)" = "closed" ]; then
              echo "::notice file=$p::vLLM issue #$issue is closed; check whether ${VLLM_VERSION} contains the fix"
            fi
          done

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          # latest=false suppresses the action's default `:latest` tag; we publish
          # accelerator-suffixed floaters (`:latest-cuda`, `:latest-rocm`) instead.
          flavor: |
            latest=false
          tags: |
            # Immutable per-build tag, taken verbatim from the git tag (cuda-vX.Y.Z-N)
            type=ref,event=tag
            # Floating per-vLLM-version tag: cuda-vX.Y.Z-N -> cuda-vX.Y.Z
            type=match,pattern=(cuda-v\d+\.\d+\.\d+)-\d+,group=1
            # Floating overall-latest CUDA tag, only on properly-formatted release tags
            type=raw,value=latest-cuda,enable=${{ startsWith(github.ref, 'refs/tags/cuda-v') }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64
          build-args: |
            BASE_IMAGE=${{ steps.base.outputs.base_image }}
            ACCEL=cuda
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=cuda
          cache-to: type=gha,mode=max,scope=cuda
